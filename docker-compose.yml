version: "3.2"
services:
  nodejs:
    build: 
      context: .
    image: fullip-services
    networks:
      - frontend
      - backend
    env_file:
      - .env
    volumes:
      - ./www/:/var/www/html/
      -  /home/admin/web/fullipscolombia.com/public_html/img/index/banner/:/var/www/html/banner/
    ports:
      - "3005:8005"
    container_name: fulllip-nodejs-app
networks:
  frontend:
  backend: