<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Cambio de correo electrónico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style type="text/css">
    /**
   * Google webfonts. Recommended to include the .woff version for cross-client compatibility.
   */
    @media screen {
      @font-face {
        font-family: 'Source Sans Pro';
        font-style: normal;
        font-weight: 400;
        src: local('Source Sans Pro Regular'), local('SourceSansPro-Regular'), url(https://fonts.gstatic.com/s/sourcesanspro/v10/ODelI1aHBYDBqgeIAH2zlBM0YzuT7MdOe03otPbuUS0.woff) format('woff');
      }

      @font-face {
        font-family: 'Source Sans Pro';
        font-style: normal;
        font-weight: 700;
        src: local('Source Sans Pro Bold'), local('SourceSansPro-Bold'), url(https://fonts.gstatic.com/s/sourcesanspro/v10/toadOcfmlt9b38dHJxOBGFkQc6VGVFSmCnC_l7QZG60.woff) format('woff');
      }
    }

    /**
   * Avoid browser level font resizing.
   * 1. Windows Mobile
   * 2. iOS / OSX
   */
    body,
    table,
    td,
    a {
      -ms-text-size-adjust: 100%;
      /* 1 */
      -webkit-text-size-adjust: 100%;
      /* 2 */
    }

    /**
   * Remove extra space added to tables and cells in Outlook.
   */
    table,
    td {
      mso-table-rspace: 0pt;
      mso-table-lspace: 0pt;
    }

    /**
   * Better fluid images in Internet Explorer.
   */
    img {
      -ms-interpolation-mode: bicubic;
    }

    /**
   * Remove blue links for iOS devices.
   */
    a[x-apple-data-detectors] {
      font-family: inherit !important;
      font-size: inherit !important;
      font-weight: inherit !important;
      line-height: inherit !important;
      color: inherit !important;
      text-decoration: none !important;
    }

    /**
   * Fix centering issues in Android 4.4.
   */
    div[style*="margin: 16px 0;"] {
      margin: 0 !important;
    }

    body {
      width: 100% !important;
      height: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    /**
   * Collapse table borders to avoid space between cells.
   */
    table {
      border-collapse: collapse !important;
    }

    a {
      color: #1a82e2;
    }

    img {
      height: auto;
      line-height: 100%;
      text-decoration: none;
      border: 0;
      outline: none;
    }

    .card {
      box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
      -webkit-box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
      -moz-box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
      background-color: #fff;
      transition: 0.3s;
      width: 50%;
      border-radius: 1em;
      max-width: 600px;
    }

    .card-body {
      margin-left: 3em;
      margin-right: 3em;
    }

    .card:hover {
      box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2);
    }

    .container {
      padding: 2px 16px;
    }

    .container-p {
      margin-top: 1.5em;
      margin-bottom: 2em;
      font-family: 'Source Sans Pro', Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 24px;
    }

    @media only screen and (max-width: 600px) {
      .card {
        width: 90%;
      }

      .card-body {
        margin-left: 1.5em;
        margin-right: 1.5em;
      }
    }

    @media only screen and (min-width: 600px) {

      /* For tablets: */
      .card {
        width: 85%;
      }
    }
  </style>

</head>

<body style="background-color: #fff2f2;">

  <!-- start preheader -->
  <div class="preheader"
    style="display: none; max-width: 0; max-height: 0; overflow: hidden; font-size: 1px; line-height: 1px; color: #fff; opacity: 0;">
    Correo electrónico modificado en tu cuenta fullips
  </div>
  <!-- end preheader -->

  <!-- start body -->
  <div style="width: 100%;padding-top: 2.6em;padding-bottom: 2.6em;">
    <center>
      <div class="card">
        <div class="container">
          <center>
            <a href="https://fullipscolombia.com/" target="_blank" style="display: inline-block;margin-top: 2.5em;">
              <img src="https://fullipscolombia.com/img/FULLIPS_COLOMBIA_JPG.jpg" alt="Logo" border="0" width="200"
                style="display: block; width: 200px; max-width: 200px; min-width: 200px;">
            </a>
          </center>
          <div class="card-body">
            <div align="left" bgcolor="#ffffff" class="container-p">
              <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -1px; line-height: 48px;">Cambio
                de correo electrónico</h1>
            </div>
            <center>
              <div align="left" bgcolor="#ffffff" class="container-p">
                <p style="margin: 0;">El correo electrónico de tu cuenta fullips ha sido cambiado. Si tú no realizaste
                  el cambio de correo, ponte en contácto con nuestro equipo.</p>
              </div>
            </center>
            <center>
              <div align="left" bgcolor="#ffffff" class="container-p">
                <p style="text-align: left;"><b>Xoxo,</b></p>
                <p style="text-align: left;">💋 Equipo Fullips Colombia 🇨🇴</p>
              </div>
            </center>
          </div>
        </div>
      </div>
    </center>
  </div>
  <!-- end body -->

</body>

</html>
